{% extends "base_dashboard.html" %}

{% block title %}Asignar Equipo - App Forge{% endblock %}

{% block content %}
<div class="app-card">
    <div class="pill-title">Asignar Desarrollador a Solicitud</div>

    <form action="{{ url_for('admin_assign', id_app=id_app) }}" method="POST" class="form-group-custom">
        <select name="id_desarrollador" class="input-capsule" required>
            <option value="" disabled selected>Selecciona un Programador disponible...</option>
            {% for dev in desarrolladores %}
                {% if dev.disponible %}
                    <option value="{{ dev.id_desarrollador }}">
                        {{ dev.nombre_completo }} — {{ dev.especialidad }} (Activos: {{ dev.proyectos_activos|default(0) }})
                    </option>
                {% endif %}
            {% endfor %}
        </select>

        <input type="text" name="rol" class="input-capsule" placeholder="Rol (ej: Lider Fullstack, Backend)..." required>
        <input type="number" name="horas_dedicadas" class="input-capsule" placeholder="Horas estimadas..." min="1" required>

        <div style="text-align: center; display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
            <button type="submit" class="btn-arrow">Conectar y Abrir Chat</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn-arrow" style="background-color: #3f3d56;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
