{% extends "base_dashboard.html" %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; background: #ffffff; border-radius: 20px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 2px solid #232551;">
    
    <div style="text-align: center; margin-bottom: 25px;">
        <span style="background-color: #232551; color: #ffffff; padding: 8px 20px; border-radius: 20px; font-weight: 800; font-size: 0.95rem; display: inline-block;">
            Asignar Desarrollador a Solicitud #{{ id_app }}
        </span>
    </div>

    <div style="background-color: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 12px 15px; margin-bottom: 20px; text-align: center;">
        <strong style="color: #232551; font-size: 0.95rem;">{{ proyecto.nombre if proyecto else 'Solicitud' }}</strong>
    </div>

    <form action="{{ url_for('admin_assign', id_app=id_app) }}" method="POST">
        
        <div style="margin-bottom: 18px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #232551; margin-bottom: 6px;">Programador</label>
            <select name="id_desarrollador" required style="width: 100%; padding: 12px; font-size: 0.9rem; border: 1.5px solid #cbd5e1; border-radius: 10px; color: #1e293b; background: #ffffff;">
                <option value="" disabled selected>Selecciona un Programador disponible...</option>
                {% if desarrolladores %}
                    {% for dev in desarrolladores %}
                        <option value="{{ dev.id_desarrollador }}">{{ dev.nombre_completo }} ({{ dev.especialidad }})</option>
                    {% endfor %}
                {% endif %}
            </select>
        </div>

        <div style="margin-bottom: 18px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #232551; margin-bottom: 6px;">Rol en el Proyecto</label>
            <input type="text" name="rol" placeholder="Ej: LIDER, Backend, Frontend..." required 
                   style="width: 100%; padding: 12px; font-size: 0.9rem; border: 1.5px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; outline: none; color: #1e293b;">
        </div>

        <div style="margin-bottom: 22px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #232551; margin-bottom: 6px;">Horas Estimadas por Día</label>
            <input type="number" name="horas_estimadas_dia" placeholder="Ej: 4, 6, 8 horas/día" min="1" max="24" required 
                   style="width: 100%; padding: 12px; font-size: 0.9rem; border: 1.5px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; outline: none; color: #1e293b;">
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end; align-items: center;">
            <a href="{{ url_for('admin_dashboard') }}" style="padding: 11px 18px; color: #64748b; text-decoration: none; font-size: 0.88rem; font-weight: 700; border-radius: 10px; background-color: #f1f5f9;">
                Cancelar
            </a>
            <button type="submit" style="padding: 11px 22px; background-color: #5b21b6; color: #ffffff; border: none; border-radius: 10px; font-size: 0.88rem; font-weight: 700; cursor: pointer;">
                Confirmar Asignación
            </button>
        </div>

    </form>
</div>

{% if ya_asignado %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    Swal.fire({
        title: ' Solicitud ya Asignada',
        text: 'Esta solicitud ya cuenta con un desarrollador asignado. Para agregar más integrantes o modificar el equipo, debes ir a la edición del proyecto.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#232551',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ir a Editar Proyecto',
        cancelButtonText: 'Volver al Dashboard',
        allowOutsideClick: false,
        borderRadius: '16px'
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = "{{ url_for('admin_edit_project', id_app=id_app) }}";
        } else {
            window.location.href = "{{ url_for('admin_dashboard') }}";
        }
    });
});
</script>
{% endif %}
{% endblock %}
