<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Forge</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style1.css') }}">
  <style>
    /* --- COLOR VARIABLES --- */
    :root {
      --navy-dark: #2d335f;
      --purple-light: #d8b8db;
      --purple-input: #817296;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: var(--white);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* --- TRIÁNGULOS DE FONDO --- */
    .bg-triangle-top-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 260px solid var(--navy-dark);
      border-left: 260px solid transparent;
      z-index: 1;
    }

    .bg-triangle-bottom-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-bottom: 260px solid var(--navy-dark);
      border-right: 260px solid transparent;
      z-index: 1;
    }

    /* --- LOGO Y ENCABEZADO --- */
    .header {
      position: relative;
      z-index: 2;
      padding: 25px 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-text {
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--purple-input);
      letter-spacing: 1px;
    }

    /* --- CONTENEDOR PRINCIPAL --- */
    .content-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 60px;
      padding: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    /* --- TARJETA DE FORMULARIO --- */
    .form-card {
      background-color: var(--white);
      border: 5px solid var(--purple-light);
      border-radius: 35px;
      padding: 30px 25px;
      width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .card-title-pill {
      background-color: var(--purple-light);
      color: var(--white);
      font-weight: bold;
      font-size: 1.3rem;
      padding: 12px 0;
      width: 85%;
      text-align: center;
      border-radius: 50px;
      margin-bottom: 25px;
    }

    .form-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .form-body input {
      width: 85%;
      padding: 14px 22px;
      border: none;
      border-radius: 50px;
      background-color: var(--purple-input);
      color: var(--white);
      font-size: 1rem;
      font-weight: bold;
      outline: none;
    }

    .form-body input::placeholder {
      color: rgba(255, 255, 255, 0.8);
      font-weight: bold;
    }

    .btn-hexagon {
      margin-top: 10px;
      background-color: var(--navy-dark);
      color: var(--white);
      font-weight: bold;
      font-size: 1rem;
      padding: 10px 35px;
      border: none;
      clip-path: polygon(12% 0%, 88% 0%, 100% 50%, 88% 100%, 12% 100%, 0% 50%);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn-hexagon:hover {
      transform: scale(1.05);
    }

    .card-triangles {
      position: absolute;
      bottom: -45px;
      display: flex;
      align-items: center;
    }

    .tri-dark {
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-bottom: 35px solid var(--navy-dark);
      margin-right: -12px;
    }

    .tri-light {
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 35px solid var(--purple-light);
    }

    /* --- SECCIÓN LEMA --- */
    .slogan-section {
      width: 380px;
      display: flex;
      justify-content: center;
    }

    .slogan-pill {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="bg-triangle-top-right"></div>
  <div class="bg-triangle-bottom-left"></div>

  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="#817296" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
          <path d="M9 10l3-3 3 3"></path>
          <path d="M12 7v7"></path>
        </svg>
      </div>
      <span class="logo-text">APP FORGE</span>
    </div>
  </header>

  <main class="content-wrapper">

    <div class="form-card">
      <div class="card-title-pill">Inicia sesión</div>

      <form class="form-body">
        <input type="email" placeholder="gmail..." required>
        <input type="password" placeholder="contraseña..." required>
        <input type="password" placeholder="confirmación..." required>

        <button type="submit" class="btn-hexagon">
          Inicia Sesión
        </button>
      </form>

      <div class="card-triangles">
        <div class="tri-dark"></div>
        <div class="tri-light"></div>
      </div>
    </div>

    <div class="slogan-section">
      <div class="card-title-pill slogan-pill">Nuestro lema es:</div>
    </div>

  </main>

</body>
</html>
