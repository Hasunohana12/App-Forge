{% extends "base.html" %}

{% block title %}Solicitar Proyecto - App Forge{% endblock %}

{% block content %}
<div class="app-card">
    <div class="pill-title">Solicita tu Proyecto</div>

    <form id="contact-form" action="{{ url_for('contact') }}" method="POST" class="form-group-custom">
        <input type="text" name="nombre" class="input-capsule" placeholder="Tu nombre..." required>
        <input type="email" name="email" class="input-capsule" placeholder="Tu correo (Gmail)..." required>
        <input type="tel" name="telefono" class="input-capsule" placeholder="Teléfono de contacto...">
        <textarea name="detalles" class="input-capsule" rows="3" placeholder="Detalles de la app que necesitas..." required></textarea>

        <div style="text-align: center;">
            <button type="submit" class="btn-arrow">Enviar Solicitud</button>
        </div>
    </form>

    <div class="triangles-decoration">
        <div class="triangle-up"></div>
        <div class="triangle-down"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
    (function(){
        emailjs.init("wl_QtPBH3gf582cBc");
    })();

    document.getElementById('contact-form').addEventListener('submit', function(event) {
        event.preventDefault(); 
        const form = this;

        emailjs.sendForm('service_ykin98m', 'template_kxvqzi9', form)
            .then(function() {
                Swal.fire({
                    title: '¡Solicitud Enviada!',
                    text: 'Revisa tu casilla de Gmail (o la carpeta Spam) para ver la confirmación.',
                    icon: 'success',
                    confirmButtonText: 'Aceptar',
                    confirmButtonColor: '#6B46C1',
                    background: '#1A1F2C',
                    color: '#FFFFFF'
                }).then((result) => {
                    if (result.isConfirmed) {
                        form.submit();
                    }
                });
            }, function(error) {
                Swal.fire({
                    title: 'Aviso de Notificación',
                    text: 'Hubo un error al enviar la notificación por correo. Procesando solicitud...',
                    icon: 'warning',
                    confirmButtonText: 'Continuar',
                    confirmButtonColor: '#6B46C1',
                    background: '#1A1F2C',
                    color: '#FFFFFF'
                }).then((result) => {
                    if (result.isConfirmed) {
                        form.submit();
                    }
                });
            });
    });
</script>
{% endblock %}
