{% extends "base.html" %}

{% block title %}Solicitar Proyecto - App Forge{% endblock %}

{% block content %}
<div class="app-card">
    <div class="pill-title">Solicita tu Proyecto</div>

    <form id="contact-form" class="form-group-custom">
        <input type="text" id="nombre" name="nombre" class="input-capsule" placeholder="Tu nombre..." required>
        <input type="email" id="email" name="email" class="input-capsule" placeholder="Tu correo (Gmail)..." required>
        <input type="tel" id="telefono" name="telefono" class="input-capsule" placeholder="Teléfono de contacto...">
        <textarea id="detalles" name="detalles" class="input-capsule" rows="3" placeholder="Detalles de la app que necesitas..." required></textarea>

        <div style="text-align: center;">
            <button type="submit" id="btn-submit" class="btn-arrow">Enviar Solicitud</button>
        </div>
    </form>

    <div class="triangles-decoration">
        <div class="triangle-up"></div>
        <div class="triangle-down"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    (function(){
        emailjs.init("wl_QtPBH3gf582cBc");
    })();

    document.getElementById('contact-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = 'Procesando...';

        const formData = new FormData(this);

        try {
            // 1. Guardar cliente y generar password en Supabase vía Flask
            const response = await fetch("{{ url_for('contact') }}", {
                method: 'POST',
                body: formData
            });

            const resData = await response.json();

            if (resData.exito) {
                // 2. Enviar Correo con EmailJS incluyendo la contraseña devuelta
                const templateParams = {
                    nombre: resData.datos.nombre,
                    email: resData.datos.email,
                    telefono: resData.datos.telefono,
                    detalles: resData.datos.detalles,
                    password_temporal: resData.password_temporal
                };

                await emailjs.send('service_ykin98m', 'template_kxvqzi9', templateParams);

                // 3. Mostrar Alerta de Éxito al usuario
                Swal.fire({
                    title: '¡Solicitud Registrada!',
                    text: 'Te hemos enviado un correo con tus credenciales de acceso a tu panel.',
                    icon: 'success',
                    confirmButtonText: 'Aceptar',
                    confirmButtonColor: '#5b21b6',
                    background: '#1e293b',
                    color: '#ffffff'
                });

                this.reset();
            } else {
                throw new Error("No se pudo registrar la solicitud.");
            }
        } catch (error) {
            console.error(error);
            Swal.fire({
                title: 'Error',
                text: 'Hubo un inconveniente al procesar tu solicitud. Intenta nuevamente.',
                icon: 'error',
                confirmButtonColor: '#5b21b6',
                background: '#1e293b',
                color: '#ffffff'
            });
        } finally {
            btn.disabled = false;
            btn.innerText = 'Enviar Solicitud';
        }
    });
</script>
{% endblock %}
